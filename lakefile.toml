name = "CORALean"
defaultTargets = ["CORALean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Well under Lean's default, so a search tactic fails loudly rather than
# quietly costing seconds. Override per declaration when justified.
maxHeartbeats = 5000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "CORALean"
srcDir = "src"
