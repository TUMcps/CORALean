name = "CORALean"
defaultTargets = ["CORALean", "Examples", "Demo"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# A fifth of Lean's default: enough for an explicit proof of any length written
# so far, so a search tactic still fails loudly rather than quietly costing
# seconds. Override per declaration when justified.
maxHeartbeats = 40000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "CORALean"
srcDir = "src"

# The worked examples, built alongside the library rather than inside it, so the
# library carries no use sites of its own and an executable has somewhere to
# live.
[[lean_lib]]
name = "Examples"
srcDir = "src"
roots = ["CORALean.Examples.API"]

# The demo twice over: as a library, so `lake build` elaborates it for the price
# of an olean, and as an executable, so a human can run it. Only `lake exe demo`
# links, and linking against Mathlib compiles its emitted C — which is why the
# check in CI runs the interpreter instead.
[[lean_lib]]
name = "Demo"
srcDir = "src"

[[lean_exe]]
name = "demo"
srcDir = "src"
root = "Demo"
