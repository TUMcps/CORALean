name = "CORALean"
defaultTargets = ["CORALean", "Examples", "Demo", "Bench", "BenchFlint"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# A fifth of Lean's default: enough for an explicit proof of any length written
# so far, so a search tactic still fails loudly rather than quietly costing
# seconds. Override per declaration when justified.
maxHeartbeats = 40000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

# The optional FLINT backend is a second root: elaborated with the library, so
# its proofs are checked on every commit, but imported by nothing a default
# executable links, since running it needs the C library (README, "FLINT
# backend (optional)").
[[lean_lib]]
name = "CORALean"
srcDir = "src"
roots = ["CORALean", "CORALean.Global.Float.Instances.Flint.API"]

# The worked examples, built alongside the library rather than inside it, so the
# library carries no use sites of its own and an executable has somewhere to
# live.
[[lean_lib]]
name = "Examples"
srcDir = "src"
roots = ["CORALean.Examples.API"]

# The demo twice over: as a library, so `lake build` elaborates it for the price
# of an olean, and as an executable, so a human can run it. Only `lake exe demo`
# links, and linking against Mathlib compiles its emitted C — which is why the
# check in CI runs the interpreter instead.
[[lean_lib]]
name = "Demo"
srcDir = "src"
roots = ["CORALean.Examples.Demo"]

[[lean_exe]]
name = "demo"
srcDir = "src"
root = "CORALean.Examples.Demo"

# The experiment harness, the same way: a library so `lake build` elaborates it
# for the price of an olean, and an executable for `lake exe bench <exp> ...`.
# `lake env lean --run src/CORALean/Examples/Bench.lean <args>` is the
# interpreter backend `experiments/README.md` documents, needing no link step.
[[lean_lib]]
name = "Bench"
srcDir = "src"
roots = ["CORALean.Examples.Bench"]

[[lean_exe]]
name = "bench"
srcDir = "src"
root = "CORALean.Examples.Bench"

# The optional FLINT-backed bench, the same shape once more: a library, in
# `defaultTargets`, so its Lean side (opaque `extern` declarations, no FLINT
# needed to elaborate them) is checked on every commit, and an executable,
# outside `defaultTargets`, so plain `lake build` never links FLINT. Only
# `lake build bench-flint` / `lake exe bench-flint` does, against the archive
# `scripts/build-flint-shim.sh` produces (README, "FLINT backend (optional)").
# Two roots, not one: `main` sits in `BenchFlintMain.lean` alone, so
# `scripts/check-axioms.lean` can import `BenchFlint.lean`'s
# `reachFloat_outer_flint` beside `Examples/Bench.lean` without two top-level
# `main`s in the same environment.
[[lean_lib]]
name = "BenchFlint"
srcDir = "src"
roots = ["CORALean.Examples.BenchFlint", "CORALean.Examples.BenchFlintMain"]

[[lean_exe]]
name = "bench-flint"
srcDir = "src"
root = "CORALean.Examples.BenchFlintMain"
moreLinkArgs = [".lake/flint/libcoralean_flint.a"]
