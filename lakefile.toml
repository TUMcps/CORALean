name = "CORALean"
defaultTargets = ["CORALean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# A fifth of Lean's default: enough for an explicit proof of any length written
# so far, so a search tactic still fails loudly rather than quietly costing
# seconds. Override per declaration when justified.
maxHeartbeats = 40000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "CORALean"
srcDir = "src"
