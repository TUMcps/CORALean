# Rebuilds CORALean on every push to the default branch and on merge requests.
#
# No caches, deliberately. Measured on 2026-09-01:
#
#   .lake/packages        7.6 GB   (Mathlib oleans are 5.8 GB of it)
#   a Lean toolchain      3.0 GB
#   .lake/build           1.1 GB   (57 MB of oleans, 1 GB of emitted C)
#
# All three are larger than what they would save. `lake exe cache get` is the
# mechanism for Mathlib: it pulls prebuilt oleans from Mathlib's own CDN, which
# is faster than zipping and unzipping 7.6 GB through GitLab's cache, and it is
# what keeps a job from compiling Mathlib from source — which would take hours.
# elan's toolchain download is compressed and costs about a minute.
#
# Caching .lake/build would make a job incremental, and is safe (lake's traces
# are content hashes), but lake regenerates every module when the emitted C is
# absent — verified 2026-09-01 — so it means carrying the full 1.1 GB, not the
# 57 MB of oleans. Worth revisiting only if pipeline time starts to matter.
#
# Expect roughly half an hour: a few minutes to fetch, then ~20 minutes to build.

variables:
  ELAN_HOME: "$CI_PROJECT_DIR/.elan"
  GIT_DEPTH: "1"
  # A rate-limited anonymous clone answers 403, which git reads as "needs
  # credentials" and then blocks asking for them. Fail instead, so the retry
  # below gets a turn rather than the job sitting until timeout.
  GIT_TERMINAL_PROMPT: "0"

conventions:
  image: debian:bookworm-slim
  # Text only — no toolchain, no Mathlib, no network — so it answers in seconds
  # and says what a green build cannot: whether `aux_` stayed in its file and
  # off every instance, whether a file under `Operations/` or `Theorems/`
  # declares more than one public thing, whether the section markers still
  # signpost the declaration Lean buries last, whether an `API.lean` holds
  # anything but imports, whether a `Real` file reached into `Float`. The same
  # scripts run on the pre-commit hook.
  #
  # `check-references.py` is the second of them: the coverage tables under
  # `references/` are prose, and prose about which theorem sits where is exactly
  # what rots, so it is checked against the tree rather than trusted.
  interruptible: true
  before_script:
    # `slim` carries no guarantee of an awk, and the script is mostly awk.
    # `check-references.py` is the second script, and wants a python. The full
    # `python3`, not `python3-minimal`, which is not guaranteed a `pathlib`.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends mawk findutils python3
  script:
    - sh scripts/check-conventions.sh
    - python3 scripts/check-references.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  image: debian:bookworm-slim
  # A push while a job is running does not cancel it. The project's "Auto-cancel
  # redundant pipelines" setting only cancels jobs that opt in here, and a job
  # that has already spent minutes cloning is not worth restarting.
  interruptible: false
  before_script:
    # `python3`, full as the conventions job's own comment explains, for the oracle's `check_sound.py`.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates python3
    # GitHub rate-limits anonymous clones per IP, and a shared university runner
    # reaches that limit. It answers 403, git reads that as "needs credentials",
    # and with prompts disabled the job dies at the ref listing. A token lifts
    # the limit by two orders of magnitude and is the actual fix; without one the
    # backoff below is what gets through, since the limit is per window and the
    # job-level `retry` restarts immediately rather than waiting.
    - |
      if [ -n "${GH_TOKEN:-}" ]; then
        git config --global credential.helper store
        printf 'https://oauth2:%s@github.com\n' "$GH_TOKEN" > ~/.git-credentials
        chmod 600 ~/.git-credentials
        echo "github: authenticated"
      else
        echo "github: anonymous — set GH_TOKEN to lift the rate limit"
      fi
    # Fetch Mathlib ourselves, shallow and by revision. `lake exe cache get`
    # otherwise clones it from inside dependency resolution, taking the whole
    # history — over a gigabyte — with no progress output, which is what looks
    # like a hang.
    #
    # By revision rather than blobless: `--filter=blob:none` defers file contents
    # to a second fetch at checkout time, so one network operation becomes two,
    # and the second one is a lazy fetch from the promisor remote that no retry
    # loop around the clone can cover. `--depth 1` of the one revision needs no
    # history and no second trip, and is a tenth of the bytes.
    - |
      REV=$(sed -n 's/.*"rev": "\([0-9a-f]\{40\}\)".*/\1/p' lake-manifest.json | head -1)
      echo "mathlib rev: $REV"
      mkdir -p .lake/packages/mathlib
      git init -q .lake/packages/mathlib
      git -C .lake/packages/mathlib remote add origin \
        https://github.com/leanprover-community/mathlib4.git
      n=0
      until git -C .lake/packages/mathlib fetch --depth 1 --progress origin "$REV"; do
        n=$((n + 1))
        if [ "$n" -ge 4 ]; then
          echo "mathlib fetch failed four times — GitHub is refusing this runner"
          exit 1
        fi
        echo "fetch failed; waiting $((n * 120))s for the rate-limit window"
        sleep $((n * 120))
      done
      git -C .lake/packages/mathlib checkout -q FETCH_HEAD
    - export PATH="$ELAN_HOME/bin:$PATH"
    - |
      curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
        | sh -s -- -y --default-toolchain none
    - elan toolchain install "$(cat lean-toolchain)"
    - lake --version
  script:
    # This resolves the eight remaining dependencies, so it clones from GitHub
    # too and hits the same limit; the same backoff applies.
    - |
      n=0
      until lake exe cache get; do
        n=$((n + 1))
        if [ "$n" -ge 3 ]; then
          echo "dependency resolution failed three times"
          exit 1
        fi
        echo "cache get failed; waiting $((n * 120))s for the rate-limit window"
        sleep $((n * 120))
      done
    # A warning is a failure: the tree is warning-free, and Mathlib's linters are
    # what catch unused hypotheses and stray `Try this` suggestions. Matched on
    # `src/` so that a partial Mathlib cache, which compiles Mathlib and may warn,
    # does not fail the job for someone else's code.
    # Builds every target `lakefile.toml` names: the library, the worked
    # examples and the demo.
    - set -o pipefail
    - lake build 2>&1 | tee build.log
    - "! grep -q '^warning: src/' build.log"
    # What a green build cannot say: whether an enclosure is any good. Runs the
    # demo and diffs it against the committed numbers, so a change that widens
    # one fails here.
    #
    # In this job rather than one of its own. There are no caches, so a second
    # job would clone Mathlib again — the step that already fails for reasons
    # outside the tree — and rebuild the library from scratch, twenty minutes
    # for the sake of a step that costs under a second once the tree is built.
    - sh scripts/check-demo.sh
    # What no build and no text check can say: whether a proof term reaches
    # `nearestUnsound`, the bench's false round-to-nearest axiom. `collectAxioms`
    # on the built tree, seconds once built, so here for the demo's reason.
    - sh scripts/check-axioms.sh
    # The oracle's own regression, through the interpreter for the reason
    # `check-demo.sh` is: under 5s once the tree is built, well inside this job.
    - |
      ORACLE="lake env lean --run src/CORALean/Examples/Oracle.lean" \
        sh experiments/oracle/selftest.sh
    # What no proof can say: whether the machine and the C lake emits do what `TrustedHardware`
    # assumes. Sampled, exactly, against the soft-float `IEEE .binary64`; see the README.
    # LINKED, unlike the two checks above: the interpreter would run the toolchain's precompiled
    # primitives, and this is about the C compiled from our own definitions. The link compiles the
    # emitted C of what the executable imports, and the timings below say what that costs.
    - t0=$(date +%s)
    - lake build hardwarecheck 2>&1 | tee hardwarecheck-build.log
    - t1=$(date +%s)
    - echo "hardwarecheck link took $((t1 - t0))s"
    - "\"$(dirname \"$(elan which lean)\")/clang\" --version | head -1"
    - .lake/build/bin/hardwarecheck | tee hardwarecheck.log
    - echo "hardwarecheck link and run took $(($(date +%s) - t0))s"
  # Only for a failure of the runner itself. Not `script_failure`: the clone is
  # the one step that fails for reasons outside the tree and it retries itself
  # above, so a script failure here is a compile error, a warning, a demo whose
  # numbers moved or a tainted axiom set — all deterministic, and retrying one
  # costs three minutes to reach the same answer.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  artifacts:
    when: always
    paths:
      - build.log
      - hardwarecheck.log
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
