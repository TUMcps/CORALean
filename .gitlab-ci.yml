# Rebuilds CORALean on every push to the default branch and on merge requests.
#
# No caches, deliberately. Measured on 2026-09-01:
#
#   .lake/packages        7.6 GB   (Mathlib oleans are 5.8 GB of it)
#   a Lean toolchain      3.0 GB
#   .lake/build           1.1 GB   (57 MB of oleans, 1 GB of emitted C)
#
# All three are larger than what they would save. `lake exe cache get` is the
# mechanism for Mathlib: it pulls prebuilt oleans from Mathlib's own CDN, which
# is faster than zipping and unzipping 7.6 GB through GitLab's cache, and it is
# what keeps a job from compiling Mathlib from source — which would take hours.
# elan's toolchain download is compressed and costs about a minute.
#
# Caching .lake/build would make a job incremental, and is safe (lake's traces
# are content hashes), but lake regenerates every module when the emitted C is
# absent — verified 2026-09-01 — so it means carrying the full 1.1 GB, not the
# 57 MB of oleans. Worth revisiting only if pipeline time starts to matter.
#
# Expect roughly half an hour: a few minutes to fetch, then ~20 minutes to build.

variables:
  ELAN_HOME: "$CI_PROJECT_DIR/.elan"
  GIT_DEPTH: "1"
  # A rate-limited anonymous clone answers 403, which git reads as "needs
  # credentials" and then blocks asking for them. Fail instead, so the retry
  # below gets a turn rather than the job sitting until timeout.
  GIT_TERMINAL_PROMPT: "0"

conventions:
  image: debian:bookworm-slim
  # Text only — no toolchain, no Mathlib, no network — so it answers in seconds
  # and says what a green build cannot: whether `aux_` stayed in its file,
  # whether an `API.lean` holds anything but imports, whether a `Real` file
  # reached into `Float`. The same script runs on the pre-commit hook.
  interruptible: true
  script:
    - sh scripts/check-conventions.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  image: debian:bookworm-slim
  # A push while a job is running does not cancel it. The project's "Auto-cancel
  # redundant pipelines" setting only cancels jobs that opt in here, and a job
  # that has already spent minutes cloning is not worth restarting.
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates
    # Clone Mathlib ourselves, blobless. `lake exe cache get` otherwise clones it
    # from inside dependency resolution, taking the whole history — over a
    # gigabyte — with no progress output, which is what looks like a hang. A
    # blobless clone fetches file contents only for the revision checked out, and
    # `--progress` makes the job say what it is doing.
    - |
      REV=$(sed -n 's/.*"rev": "\([0-9a-f]\{40\}\)".*/\1/p' lake-manifest.json | head -1)
      echo "mathlib rev: $REV"
      mkdir -p .lake/packages
      git clone --filter=blob:none --no-checkout --progress https://github.com/leanprover-community/mathlib4.git .lake/packages/mathlib
      git -C .lake/packages/mathlib checkout --progress "$REV"
    - export PATH="$ELAN_HOME/bin:$PATH"
    - |
      curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
        | sh -s -- -y --default-toolchain none
    - elan toolchain install "$(cat lean-toolchain)"
    - lake --version
  script:
    - lake exe cache get
    # A warning is a failure: the tree is warning-free, and Mathlib's linters are
    # what catch unused hypotheses and stray `Try this` suggestions. Matched on
    # `src/` so that a partial Mathlib cache, which compiles Mathlib and may warn,
    # does not fail the job for someone else's code.
    - set -o pipefail
    - lake build 2>&1 | tee build.log
    - "! grep -q '^warning: src/' build.log"
  # The clone above is the only step that fails for reasons outside the tree, and
  # it fails immediately, so a retry costs seconds when it succeeds and one
  # wasted minute when it does not.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  artifacts:
    when: on_failure
    paths:
      - build.log
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
